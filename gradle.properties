# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# NOTE: Due to '!' character in BUDGIES! folder name causing ZipFileSystem issues with Fabric Loom,
# always run gradle with: --project-cache-dir "C:\BudgiesMod\gradle-cache"
# Example: .\gradlew.bat build --project-cache-dir "C:\BudgiesMod\gradle-cache"

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_name=budgies
mod_loader=fabric
version=1.0.0
group=com.nadir.budgies

# Dependencies
fabric_api_version=0.107.0+1.21.1
