plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

// Jar dosyası adı: {mod_name}-{version}-{minecraft_version}-{mod_loader}
base {
	archivesName = "${project.mod_name}-${project.version}-${project.minecraft_version}-${project.mod_loader}"
}

repositories {
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroupByRegex("software\\.bernie.*")
			includeGroup("com.eliotlash.mclib")
		}
	}
}

// Override build directory to avoid ZipFileSystem bug caused by '!' in the project path
layout.buildDirectory.set(file("C:/BudgiesMod/build"))

loom {
	// Override cache directory to avoid ZipFileSystem issues caused by '!' in the project path
	// See: https://github.com/FabricMC/fabric-loom/issues (known issue with special chars in paths)
	splitEnvironmentSourceSets()

	mods {
		"budgies" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// GeckoLib for entity animations
	modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:4.9"
}

configurations.all {
	resolutionStrategy {
		// Fix duplicate mixin class conflict between fabric-convention-tags-v2 and fabric-tag-api-v1
		force "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
